<?xml version="1.0" encoding="UTF-8"?>
<!-- iot_robot power distribution. Hand-written SVG; edit this file directly. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .title { font-size: 26px; font-weight: bold; }
    .subtitle { font-size: 15px; fill: #444; }
    .h { font-size: 17px; font-weight: bold; }
    .ph { font-size: 17px; font-weight: bold; fill: #0d47a1; }
    .t { font-size: 14px; }
    .s { font-size: 13px; fill: #333; }
    .b { font-weight: bold; }
    .box { stroke: #333; stroke-width: 1.6; }
    .pwr { fill: #fff3e0; }
    .act { fill: #e3f2fd; }
    .cpu { fill: #e8f5e9; }
    .opt { fill: #ffffff; stroke-dasharray: 7 5; }
    .panel { fill: #fafafa; stroke: #999; stroke-width: 1.2; }
    .pos { stroke: #c62828; stroke-width: 6; fill: none; stroke-linejoin: round; }
    .neg { stroke: #212121; stroke-width: 6; fill: none; stroke-linejoin: round; }
    .v5 { stroke: #ef6c00; stroke-width: 5; fill: none; }
    .gnd5 { stroke: #212121; stroke-width: 4; fill: none; }
    .ctl { stroke: #c62828; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
    .wire { stroke: #333; stroke-width: 2.2; fill: none; stroke-linejoin: round; }
    .sense { stroke: #6d4c41; stroke-width: 2.5; fill: none; }
    .dash { stroke-dasharray: 8 6; }
    .thin { stroke-width: 3.5; }
    .sym { fill: #ffffff; stroke: #333; stroke-width: 2; }
    .term { fill: #ffffff; stroke: #333; stroke-width: 2; }
    .jdot { fill: #c62828; }
    .ndot { fill: #212121; }
    .flag { fill: #fafafa; stroke: #777; stroke-width: 1.2; }
  </style>
  <rect x="0" y="0" width="1600" height="1170" fill="#ffffff"/>

  <text x="30" y="42" class="title">iot_robot: power distribution</text>
  <text x="30" y="68" class="subtitle">Red = +24 V, black = 0 V (battery negative), orange = 5 V. Ratings are recommendations; check them against the parts you buy.</text>

  <!-- ================= Main +24 V path ================= -->
  <path class="pos" d="M120 320 V200 H250"/>
  <path class="pos" d="M340 200 H405"/>
  <path class="pos" d="M515 200 H785"/>
  <path class="pos" d="M895 200 H1450"/>
  <path class="pos" d="M1070 200 V330"/>
  <path class="pos" d="M1260 200 V330"/>
  <path class="pos dash thin" d="M1450 200 V330"/>
  <path class="pos" d="M590 200 V270"/>
  <path class="pos" d="M590 330 V380"/>
  <path class="sense dash" d="M590 200 V124"/>

  <!-- ================= 0 V return path ================= -->
  <path class="neg" d="M120 480 V600 H1450"/>
  <path class="neg" d="M1070 450 V600"/>
  <path class="neg" d="M1260 450 V600"/>
  <path class="neg dash thin" d="M1450 450 V600"/>
  <path class="neg" d="M560 500 V600"/>

  <!-- ================= Buck to Pi ================= -->
  <path class="v5" d="M700 420 H770"/>
  <path class="gnd5" d="M700 470 H770"/>

  <!-- junction dots -->
  <circle class="jdot" cx="590" cy="200" r="7"/>
  <circle class="jdot" cx="960" cy="200" r="7"/>
  <circle class="jdot" cx="1070" cy="200" r="6"/>
  <circle class="jdot" cx="1260" cy="200" r="6"/>
  <circle class="ndot" cx="560" cy="600" r="6"/>
  <circle class="ndot" cx="1070" cy="600" r="6"/>
  <circle class="ndot" cx="1260" cy="600" r="6"/>

  <!-- Battery -->
  <rect class="box pwr" x="40" y="320" width="160" height="160" rx="8"/>
  <text x="120" y="356" class="h" text-anchor="middle">6S LiPo</text>
  <text x="120" y="380" class="t" text-anchor="middle">22.2 V nominal</text>
  <text x="120" y="400" class="t" text-anchor="middle">25.2 V full</text>
  <text x="120" y="420" class="t" text-anchor="middle">stop at 21 V</text>
  <text x="120" y="446" class="s" text-anchor="middle">plug TBD (XT60?)</text>
  <text x="132" y="306" class="h" fill="#c62828">+</text>
  <text x="132" y="508" class="h">-</text>
  <text x="132" y="262" class="s">16 AWG</text>

  <!-- F1 main fuse -->
  <rect class="sym" x="250" y="189" width="90" height="22" rx="3"/>
  <line x1="250" y1="200" x2="340" y2="200" stroke="#333" stroke-width="2"/>
  <text x="295" y="176" class="h" text-anchor="middle">F1 15 A</text>
  <text x="295" y="234" class="s" text-anchor="middle">blade fuse, within</text>
  <text x="295" y="250" class="s" text-anchor="middle">10 cm of battery +</text>

  <!-- SW1 main switch -->
  <circle class="term" cx="410" cy="200" r="5"/>
  <circle class="term" cx="510" cy="200" r="5"/>
  <line x1="414" y1="197" x2="500" y2="172" stroke="#333" stroke-width="3"/>
  <text x="460" y="150" class="h" text-anchor="middle">SW1 main switch</text>
  <text x="460" y="234" class="s" text-anchor="middle">rated 20 A DC or more,</text>
  <text x="460" y="250" class="s" text-anchor="middle">30 V DC or more</text>

  <!-- battery sense flag (detail B) -->
  <rect class="flag" x="490" y="84" width="200" height="40" rx="4"/>
  <text x="590" y="100" class="s" text-anchor="middle">battery sense tap (opt.)</text>
  <text x="590" y="116" class="s" text-anchor="middle">100 kΩ at this end, see B</text>

  <text x="602" y="232" class="s b">J1: +24 V switched</text>

  <!-- S1 E-stop (NC, drawn in the rail) -->
  <circle class="term" cx="790" cy="200" r="5"/>
  <circle class="term" cx="890" cy="200" r="5"/>
  <line x1="784" y1="207" x2="896" y2="207" stroke="#333" stroke-width="4"/>
  <line x1="840" y1="207" x2="840" y2="165" stroke="#333" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M818 165 A22 22 0 0 1 862 165 Z" fill="#d32f2f" stroke="#7f0000" stroke-width="1.5"/>
  <text x="840" y="128" class="h" text-anchor="middle" fill="#b71c1c">S1 E-STOP (NC, latching)</text>
  <text x="840" y="236" class="s" text-anchor="middle">cuts motor power only: the wheels</text>
  <text x="840" y="252" class="s" text-anchor="middle">coast, the Pi stays on. Contacts</text>
  <text x="840" y="268" class="s" text-anchor="middle">10 A DC or more, else see C</text>

  <!-- recovery: the motor plugin latches a stop while the drives are unpowered, and
       restarting the robot software lets any active command drive again -->
  <rect x="752" y="282" width="230" height="80" rx="4" fill="#ffebee" stroke="#b71c1c" stroke-width="1.5"/>
  <text x="867" y="300" class="s b" text-anchor="middle" fill="#b71c1c">After an E-stop press:</text>
  <text x="867" y="318" class="s" text-anchor="middle">stop follower and teleop,</text>
  <text x="867" y="336" class="s" text-anchor="middle">release S1, then restart</text>
  <text x="867" y="354" class="s" text-anchor="middle">the robot software.</text>

  <text x="968" y="186" class="s b">J2</text>
  <text x="1090" y="188" class="s">+24 V motor bus, 16 AWG</text>

  <!-- Motors and optional servo BEC -->
  <rect class="box act" x="990" y="330" width="160" height="120" rx="8"/>
  <text x="1070" y="360" class="h" text-anchor="middle">AK45-10 LEFT</text>
  <text x="1070" y="384" class="t" text-anchor="middle">XT30 power input</text>
  <text x="1070" y="406" class="t" text-anchor="middle">5 A peak, 2.1 A rated</text>
  <text x="1070" y="428" class="t" text-anchor="middle">18-28 V allowed</text>

  <rect class="box act" x="1180" y="330" width="160" height="120" rx="8"/>
  <text x="1260" y="360" class="h" text-anchor="middle">AK45-10 RIGHT</text>
  <text x="1260" y="384" class="t" text-anchor="middle">XT30 power input</text>
  <text x="1260" y="406" class="t" text-anchor="middle">5 A peak, 2.1 A rated</text>
  <text x="1260" y="428" class="t" text-anchor="middle">18-28 V allowed</text>

  <rect class="box opt" x="1370" y="330" width="160" height="120" rx="8"/>
  <text x="1450" y="360" class="h" text-anchor="middle">Servo BEC</text>
  <text x="1450" y="384" class="t" text-anchor="middle">optional</text>
  <text x="1450" y="406" class="t" text-anchor="middle">input rated for 6S</text>
  <text x="1450" y="428" class="t" text-anchor="middle">out 5-6 V, 3 A</text>

  <!-- F3 servo BEC branch fuse (optional, holder at J2) -->
  <rect class="sym" x="1439" y="240" width="22" height="54" rx="3"/>
  <line x1="1450" y1="240" x2="1450" y2="294" stroke="#333" stroke-width="2"/>
  <text x="1472" y="262" class="h">F3 3 A</text>
  <text x="1472" y="282" class="s">holder at J2</text>

  <text x="1078" y="322" class="t b" fill="#c62828">+</text>
  <text x="1268" y="322" class="t b" fill="#c62828">+</text>
  <text x="1078" y="470" class="t b">-</text>
  <text x="1268" y="470" class="t b">-</text>
  <text x="1090" y="590" class="s">0 V bus, 16 AWG</text>
  <text x="600" y="622" class="s b">0 V bus = one terminal block, the ground star point: every return has its own wire to it.</text>
  <text x="200" y="590" class="s">battery negative</text>

  <!-- F2 buck fuse -->
  <rect class="sym" x="579" y="270" width="22" height="60" rx="3"/>
  <line x1="590" y1="270" x2="590" y2="330" stroke="#333" stroke-width="2"/>
  <text x="612" y="296" class="h">F2 3 A</text>
  <text x="612" y="316" class="s">holder at J1, 20 AWG</text>
  <text x="598" y="372" class="s">IN+</text>

  <!-- Buck -->
  <rect class="box pwr" x="500" y="380" width="200" height="120" rx="8"/>
  <text x="600" y="408" class="h" text-anchor="middle">Buck converter</text>
  <text x="600" y="430" class="t" text-anchor="middle">24 V in, 5.1 V out</text>
  <text x="600" y="450" class="t" text-anchor="middle">5 A (Pi 5), 3 A (Pi 4)</text>
  <text x="600" y="470" class="t" text-anchor="middle">input 30 V or more</text>
  <text x="600" y="490" class="s" text-anchor="middle">model TBD</text>
  <text x="568" y="522" class="s">IN-</text>
  <text x="735" y="412" class="s" text-anchor="middle">5.1 V</text>
  <text x="735" y="490" class="s" text-anchor="middle">0 V</text>

  <!-- Pi -->
  <rect class="box cpu" x="770" y="380" width="140" height="120" rx="8"/>
  <text x="840" y="412" class="h" text-anchor="middle">Raspberry Pi</text>
  <text x="840" y="436" class="t" text-anchor="middle">model TBD</text>
  <text x="840" y="458" class="t" text-anchor="middle">USB-C in (A1)</text>
  <text x="840" y="478" class="t" text-anchor="middle">or GPIO (A2)</text>
  <text x="840" y="524" class="s" text-anchor="middle">18 AWG, 30 cm max</text>

  <!-- ================= Panel A: feeding the Pi ================= -->
  <rect class="panel" x="30" y="640" width="495" height="515" rx="8"/>
  <text x="45" y="668" class="ph">A. Feeding 5 V into the Pi</text>
  <text x="45" y="698" class="t b">A1 (recommended): USB-C socket</text>
  <text x="45" y="720" class="s">- USB-C power lead from the buck output, short and thick.</text>
  <text x="45" y="738" class="s">- Keeps the Pi's own input protection in the circuit.</text>
  <text x="45" y="756" class="s">- A plain buck does not talk USB-PD. A Pi 5 then assumes a</text>
  <text x="56" y="774" class="s">3 A supply and limits its USB ports to 600 mA in total.</text>
  <text x="45" y="792" class="s">- If the buck really delivers 5 A, set PSU_MAX_CURRENT=5000</text>
  <text x="56" y="810" class="s">in the Pi 5 bootloader EEPROM to lift that limit.</text>

  <text x="45" y="846" class="t b">A2: GPIO header pins</text>
  <text x="45" y="868" class="s">- 5 V to pins 2 and 4, 0 V to pins 6 and 14.</text>
  <text x="45" y="886" class="s">- Bypasses the Pi's input protection: a</text>
  <text x="56" y="904" class="s">failed buck puts up to 25 V onto the Pi.</text>
  <text x="45" y="922" class="s">- Dupont contacts carry about 1-1.5 A each.</text>
  <text x="56" y="940" class="s">Use a 1x3 housing on pins 2/4/6 plus one</text>
  <text x="56" y="958" class="s">contact on pin 14, never a 2x2 housing.</text>
  <text x="45" y="976" class="s">- Same 600 mA USB limit on a Pi 5 unless</text>
  <text x="56" y="994" class="s">usb_max_current_enable=1 or PSU_MAX_CURRENT.</text>

  <text x="45" y="1030" class="t b">Buck rating</text>
  <text x="45" y="1052" class="s">- Pi 5: 5.1 V, 5 A (the official PSU is 27 W). Pi 4: 5.1 V, 3 A.</text>
  <text x="45" y="1070" class="s">- The Pi warns about undervoltage below 4.63 V: set the</text>
  <text x="56" y="1088" class="s">buck to 5.1 V with no load, then check it under load.</text>
  <text x="45" y="1106" class="s">- The camera takes about 250 mA; USB-CAN adapter and</text>
  <text x="56" y="1124" class="s">Nucleo are powered from the Pi's USB ports.</text>

  <!-- 40-pin header snippet, pins 1-14 -->
  <g transform="translate(-22,0)">
  <text x="450" y="846" class="s b" text-anchor="middle">Pi header, pins 1-14</text>
  <rect x="420" y="858" width="60" height="148" rx="4" fill="#263238"/>
  <!-- odd column (x=437), even column (x=463); rows every 20 px from y=872 -->
  <rect x="430" y="865" width="14" height="14" fill="#ffffff" stroke="#999"/>
  <circle cx="463" cy="872" r="7" fill="#c62828"/>
  <circle cx="437" cy="892" r="7" fill="#b0bec5"/>
  <circle cx="463" cy="892" r="7" fill="#c62828"/>
  <circle cx="437" cy="912" r="7" fill="#b0bec5"/>
  <circle cx="463" cy="912" r="7" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="437" cy="932" r="7" fill="#b0bec5"/>
  <circle cx="463" cy="932" r="7" fill="#b0bec5"/>
  <circle cx="437" cy="952" r="7" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="463" cy="952" r="7" fill="#b0bec5"/>
  <circle cx="437" cy="972" r="7" fill="#b0bec5"/>
  <circle cx="463" cy="972" r="7" fill="#b0bec5"/>
  <circle cx="437" cy="992" r="7" fill="#b0bec5"/>
  <circle cx="463" cy="992" r="7" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
  <text x="488" y="877" class="s">2 5V</text>
  <text x="488" y="897" class="s">4 5V</text>
  <text x="488" y="917" class="s">6 GND</text>
  <text x="488" y="997" class="s">14 GND</text>
  <text x="414" y="957" class="s" text-anchor="end">GND 9</text>
  <text x="420" y="1022" class="s">pin 1 = square pad</text>
  </g>

  <!-- ================= Panel B: battery sense ================= -->
  <rect class="panel" x="545" y="640" width="470" height="515" rx="8"/>
  <text x="560" y="668" class="ph">B. Battery sense (optional)</text>
  <text x="650" y="704" class="s b" text-anchor="middle">J1 (+24 V switched)</text>
  <path class="sense" d="M650 712 V730"/>
  <rect class="sym" x="640" y="730" width="20" height="60"/>
  <text x="672" y="756" class="t b">R1 100 kΩ</text>
  <text x="672" y="774" class="s">mounted at the J1 end</text>
  <path class="sense" d="M650 790 V870 H860"/>
  <text x="672" y="826" class="s">signal wire to the Nucleo</text>
  <text x="672" y="842" class="s">(any length, 22-26 AWG)</text>
  <circle cx="650" cy="870" r="5" fill="#6d4c41"/>
  <circle cx="740" cy="870" r="5" fill="#6d4c41"/>
  <rect class="flag" x="860" y="852" width="140" height="36" rx="4"/>
  <text x="930" y="867" class="s b" text-anchor="middle">PA4 = A2</text>
  <text x="930" y="883" class="s" text-anchor="middle">CN8-3 / CN7-32</text>
  <path class="wire" d="M650 870 V890"/>
  <rect class="sym" x="640" y="890" width="20" height="60"/>
  <path class="wire" d="M650 950 V980 H740 V920"/>
  <path class="wire" d="M740 870 V910"/>
  <line x1="718" y1="910" x2="762" y2="910" stroke="#333" stroke-width="3"/>
  <line x1="718" y1="920" x2="762" y2="920" stroke="#333" stroke-width="3"/>
  <text x="632" y="918" class="t b" text-anchor="end">R2 10 kΩ</text>
  <text x="772" y="920" class="t b">C1 100 nF</text>
  <path class="wire" d="M695 980 V996"/>
  <line x1="679" y1="996" x2="711" y2="996" stroke="#333" stroke-width="2.5"/>
  <line x1="685" y1="1002" x2="705" y2="1002" stroke="#333" stroke-width="2.5"/>
  <line x1="691" y1="1008" x2="699" y2="1008" stroke="#333" stroke-width="2.5"/>
  <text x="720" y="1004" class="s">Nucleo GND (CN6-6), R2 and C1 at the Nucleo</text>
  <text x="560" y="1042" class="s">- V(PA4) = V(battery) / 11: 25.2 V gives 2.29 V.</text>
  <text x="560" y="1060" class="s">- ADC full scale 3.3 V corresponds to 36.3 V.</text>
  <text x="560" y="1078" class="s">- With R1 at J1, a chafed signal wire shorted to 0 V</text>
  <text x="571" y="1096" class="s">draws only 0.25 mA instead of blowing F1.</text>
  <text x="560" y="1114" class="s">- Tapped after SW1, so it draws nothing when switched off.</text>
  <text x="560" y="1132" class="s">- Off by default in firmware; the STM32 then sends no V: field.</text>

  <!-- ================= Panel C: E-stop through a relay ================= -->
  <rect class="panel" x="1035" y="640" width="535" height="515" rx="8"/>
  <text x="1050" y="668" class="ph">C. E-stop through a relay (alternative)</text>
  <text x="1050" y="692" class="s">Use this if the E-stop contact is not rated for 10 A DC or more.</text>

  <path class="pos" d="M1080 760 H1255"/>
  <path class="pos" d="M1345 760 H1520"/>
  <circle class="jdot" cx="1080" cy="760" r="6"/>
  <text x="1070" y="745" class="s b">J1</text>
  <text x="1520" y="745" class="s b" text-anchor="end">J2 motor bus</text>
  <circle class="term" cx="1260" cy="760" r="5"/>
  <circle class="term" cx="1340" cy="760" r="5"/>
  <line x1="1264" y1="757" x2="1334" y2="738" stroke="#333" stroke-width="3"/>
  <text x="1300" y="728" class="s b" text-anchor="middle">K1 contact (NO)</text>
  <line x1="1300" y1="846" x2="1300" y2="750" stroke="#333" stroke-width="1.8" stroke-dasharray="5 4"/>

  <path class="ctl" d="M1080 760 V860 H1115"/>
  <!-- F4 coil-loop fuse, holder at J1 -->
  <rect class="sym" x="1071" y="782" width="18" height="40" rx="3"/>
  <line x1="1080" y1="782" x2="1080" y2="822" stroke="#333" stroke-width="2"/>
  <text x="1096" y="807" class="s b">F4 1 A</text>
  <circle class="term" cx="1120" cy="860" r="5"/>
  <circle class="term" cx="1200" cy="860" r="5"/>
  <line x1="1114" y1="867" x2="1206" y2="867" stroke="#333" stroke-width="4"/>
  <line x1="1160" y1="867" x2="1160" y2="832" stroke="#333" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M1144 832 A16 16 0 0 1 1176 832 Z" fill="#d32f2f" stroke="#7f0000" stroke-width="1.5"/>
  <text x="1184" y="830" class="s b">S1 E-stop</text>
  <path class="ctl" d="M1205 860 H1270"/>
  <rect class="sym" x="1270" y="846" width="60" height="28"/>
  <text x="1300" y="865" class="s b" text-anchor="middle">K1</text>
  <path class="ctl" d="M1330 860 H1460 V930" style="stroke:#212121"/>
  <circle cx="1245" cy="860" r="4" fill="#c62828"/>
  <circle cx="1355" cy="860" r="4" fill="#212121"/>
  <path class="wire" d="M1245 860 V910 H1290"/>
  <path class="wire" d="M1315 910 H1355 V860"/>
  <line x1="1290" y1="900" x2="1290" y2="920" stroke="#333" stroke-width="3"/>
  <polygon points="1290,910 1315,900 1315,920" fill="#333"/>
  <text x="1302" y="940" class="s b" text-anchor="middle">D1</text>
  <line x1="1444" y1="930" x2="1476" y2="930" stroke="#333" stroke-width="2.5"/>
  <line x1="1450" y1="936" x2="1470" y2="936" stroke="#333" stroke-width="2.5"/>
  <line x1="1456" y1="942" x2="1464" y2="942" stroke="#333" stroke-width="2.5"/>
  <text x="1480" y="938" class="s">0 V</text>

  <text x="1050" y="980" class="s">- F4: 1 A fuse, holder at J1, protects the 22 AWG coil wiring.</text>
  <text x="1050" y="998" class="s">- S1: E-stop NC contact. It now switches only the coil current.</text>
  <text x="1050" y="1016" class="s">- K1: relay or contactor, 24 V coil, contacts 20 A DC or more.</text>
  <text x="1050" y="1034" class="s">- D1: 1N4007 across the coil, stripe (cathode) to the + side.</text>
  <text x="1050" y="1052" class="s">- Press S1: K1 drops out, the motor bus goes dead and the</text>
  <text x="1061" y="1070" class="s">wheels coast. The Pi and the Nucleo stay on.</text>
  <text x="1050" y="1088" class="s b" fill="#b71c1c">- On release the drivers reboot and wait. Stop follower and</text>
  <text x="1061" y="1106" class="s b" fill="#b71c1c">teleop, then restart the robot software to drive again.</text>
  <text x="1050" y="1124" class="s">- Closing the motor bus charges the drivers' input capacitors:</text>
  <text x="1061" y="1142" class="s">expect a small spark at the XT30 or the contact.</text>
</svg>
