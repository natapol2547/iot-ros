<?xml version="1.0" encoding="UTF-8"?>
<!-- iot_robot system overview. Hand-written SVG; edit this file directly. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1065" viewBox="0 0 1600 1065">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .title { font-size: 26px; font-weight: bold; }
    .subtitle { font-size: 15px; fill: #444; }
    .h { font-size: 17px; font-weight: bold; }
    .t { font-size: 14px; }
    .s { font-size: 13px; fill: #333; }
    .box { stroke: #333; stroke-width: 1.6; }
    .pwr { fill: #fff3e0; }
    .act { fill: #e3f2fd; }
    .cpu { fill: #e8f5e9; }
    .sen { fill: #f3e5f5; }
    .opt { fill: #ffffff; stroke-dasharray: 7 5; }
    .stop { fill: #ffebee; stroke: #b71c1c; stroke-width: 2.4; }
    .w24 { stroke: #c62828; stroke-width: 6; fill: none; stroke-linejoin: round; }
    .w5 { stroke: #ef6c00; stroke-width: 5; fill: none; }
    .usb { stroke: #1565c0; stroke-width: 3; fill: none; stroke-linejoin: round; }
    .can { stroke: #6a1b9a; stroke-width: 3.5; fill: none; stroke-linejoin: round; }
    .i2c { stroke: #00838f; stroke-width: 3; fill: none; stroke-linejoin: round; }
    .sig { stroke: #2e7d32; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
    .csi { stroke: #455a64; stroke-width: 7; fill: none; }
    .sense { stroke: #6d4c41; stroke-width: 2.5; fill: none; }
    .dash { stroke-dasharray: 8 6; }
    .dot { fill: #c62828; }
    .flag { fill: #fafafa; stroke: #777; stroke-width: 1.2; }
  </style>
  <rect x="0" y="0" width="1600" height="1065" fill="#ffffff"/>

  <text x="30" y="42" class="title">iot_robot: system overview</text>
  <text x="30" y="70" class="subtitle">Power and data paths. Thick lines carry power, thin lines carry data, dashed parts are optional. Not to scale; see the other diagrams for pins.</text>

  <!-- ===== Power wiring (drawn first so boxes sit on top) ===== -->
  <path class="w24" d="M220 190 H260"/>
  <path class="w24" d="M370 190 H410"/>
  <path class="w24" d="M530 190 H630"/>
  <path class="w24" d="M780 190 H1170"/>
  <path class="w24" d="M1260 190 H1495"/>
  <path class="w24" d="M945 190 V290"/>
  <path class="w24" d="M1125 190 V290"/>
  <path class="w24" d="M1315 190 V290"/>
  <path class="w24" d="M1495 190 V290"/>
  <path class="w24" d="M580 190 V280"/>
  <path class="w24" d="M580 330 V380"/>
  <path class="w5" d="M580 470 V540"/>
  <circle class="dot" cx="580" cy="190" r="7"/>
  <circle class="dot" cx="830" cy="190" r="7"/>
  <circle class="dot" cx="945" cy="190" r="5"/>
  <circle class="dot" cx="1125" cy="190" r="5"/>
  <circle class="dot" cx="1315" cy="190" r="7"/>
  <circle class="dot" cx="1495" cy="190" r="5"/>
  <text x="590" y="176" class="s">J1</text>
  <text x="840" y="176" class="s">J2</text>
  <text x="862" y="176" class="s">motor supply, 16 AWG</text>
  <text x="1325" y="176" class="s">J3, gizmo branch</text>
  <text x="598" y="512" class="s">5.1 V via USB-C</text>

  <!-- battery-sense tap (optional) from the switched node -->
  <circle class="dot" cx="580" cy="250" r="5"/>
  <path class="sense dash" d="M580 250 H560"/>
  <rect class="flag" x="398" y="236" width="162" height="28" rx="4"/>
  <text x="479" y="255" class="s" text-anchor="middle">to battery sense (opt.)</text>

  <!-- ===== Data wiring ===== -->
  <path class="can" d="M945 440 V390"/>
  <text x="955" y="422" class="s">CAN 1 Mbit/s</text>
  <path class="can" d="M1020 340 H1050"/>
  <path class="can" d="M1200 340 H1240"/>
  <path class="can" d="M1390 340 H1420"/>
  <path class="can" d="M1495 390 V430"/>
  <path class="usb" d="M770 580 H970 V520"/>
  <text x="790" y="572" class="s">USB</text>
  <path class="usb" d="M770 640 H1080"/>
  <text x="790" y="632" class="s">USB (ST-LINK virtual COM port)</text>
  <path class="i2c" d="M340 630 H430"/>
  <text x="352" y="622" class="s">I2C</text>
  <path class="sig" d="M1290 585 H1370"/>
  <path class="sig" d="M1290 675 H1370"/>
  <path class="csi" d="M530 710 V805"/>
  <text x="545" y="752" class="s">CSI ribbon, standard</text>
  <text x="545" y="768" class="s">15-pin at both ends</text>
  <path class="sense dash" d="M1250 700 V780"/>

  <!-- ===== Power chain boxes ===== -->
  <rect class="box pwr" x="30" y="140" width="190" height="100" rx="8"/>
  <text x="125" y="168" class="h" text-anchor="middle">6S LiPo, XT60</text>
  <text x="125" y="190" class="t" text-anchor="middle">22.2 V nominal</text>
  <text x="125" y="209" class="t" text-anchor="middle">25.2 V full</text>
  <text x="125" y="228" class="t" text-anchor="middle">capacity TBD</text>

  <rect class="box pwr" x="260" y="160" width="110" height="60" rx="8"/>
  <text x="315" y="185" class="h" text-anchor="middle">F1 fuse</text>
  <text x="315" y="207" class="t" text-anchor="middle">15 A</text>

  <rect class="box pwr" x="410" y="160" width="120" height="60" rx="8"/>
  <text x="470" y="185" class="h" text-anchor="middle">SW1</text>
  <text x="470" y="207" class="t" text-anchor="middle">main switch</text>

  <rect class="box stop" x="630" y="150" width="150" height="80" rx="8"/>
  <text x="705" y="178" class="h" text-anchor="middle" fill="#b71c1c">E-STOP</text>
  <text x="705" y="198" class="t" text-anchor="middle">cuts all 4 motors</text>
  <text x="705" y="217" class="t" text-anchor="middle">(Pi stays on)</text>

  <rect class="box pwr" x="1170" y="170" width="90" height="40" rx="6"/>
  <text x="1215" y="195" class="h" text-anchor="middle">F3 5 A</text>

  <rect class="box pwr" x="530" y="280" width="100" height="50" rx="8"/>
  <text x="580" y="302" class="h" text-anchor="middle">F2 fuse</text>
  <text x="580" y="321" class="t" text-anchor="middle">3 A</text>

  <rect class="box pwr" x="480" y="380" width="200" height="90" rx="8"/>
  <text x="580" y="408" class="h" text-anchor="middle">Buck converter</text>
  <text x="580" y="430" class="t" text-anchor="middle">24 V to 5.1 V</text>
  <text x="580" y="450" class="t" text-anchor="middle">3 A or more (5 A: margin)</text>

  <!-- ===== Motors and CAN ===== -->
  <rect x="1228" y="262" width="354" height="140" rx="12" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="1236" y="420" class="s">Pan/tilt gizmo</text>

  <rect class="box act" x="870" y="290" width="150" height="100" rx="8"/>
  <text x="945" y="318" class="h" text-anchor="middle">LEFT wheel</text>
  <text x="945" y="340" class="t" text-anchor="middle">AK45-10</text>
  <text x="945" y="362" class="t" text-anchor="middle">ID 12</text>

  <rect class="box act" x="1050" y="290" width="150" height="100" rx="8"/>
  <text x="1125" y="318" class="h" text-anchor="middle">RIGHT wheel</text>
  <text x="1125" y="340" class="t" text-anchor="middle">AK45-10</text>
  <text x="1125" y="362" class="t" text-anchor="middle">ID 13</text>

  <rect class="box act" x="1240" y="290" width="150" height="100" rx="8"/>
  <text x="1315" y="318" class="h" text-anchor="middle">gizmo YAW</text>
  <text x="1315" y="340" class="t" text-anchor="middle">AK45-10</text>
  <text x="1315" y="362" class="t" text-anchor="middle">ID 10</text>

  <rect class="box act" x="1420" y="290" width="150" height="100" rx="8"/>
  <text x="1495" y="318" class="h" text-anchor="middle">gizmo PITCH</text>
  <text x="1495" y="340" class="t" text-anchor="middle">AK45-10</text>
  <text x="1495" y="362" class="t" text-anchor="middle">ID 11</text>

  <rect class="flag" x="1420" y="430" width="150" height="40" rx="4"/>
  <text x="1495" y="447" class="s" text-anchor="middle">R_T 120 Ω</text>
  <text x="1495" y="463" class="s" text-anchor="middle">(bus end B)</text>

  <rect class="box cpu" x="870" y="440" width="200" height="80" rx="8"/>
  <text x="970" y="466" class="h" text-anchor="middle">usb2can</text>
  <text x="970" y="487" class="t" text-anchor="middle">gs_usb, appears as can0</text>
  <text x="970" y="507" class="t" text-anchor="middle">120 Ω at this end</text>

  <!-- ===== Computer ===== -->
  <rect class="box cpu" x="430" y="540" width="340" height="170" rx="10"/>
  <text x="600" y="574" class="h" text-anchor="middle">Raspberry Pi 4</text>
  <text x="600" y="598" class="t" text-anchor="middle">ROS 2 Jazzy</text>
  <text x="600" y="620" class="t" text-anchor="middle">CAN: all 4 motors, can0 via usb2can</text>
  <text x="600" y="642" class="t" text-anchor="middle">STM32: /dev/stm32 (ttyACM)</text>
  <text x="600" y="664" class="t" text-anchor="middle">IMU: I2C bus 1 (header pins 1-9)</text>
  <text x="600" y="686" class="t" text-anchor="middle">camera: CAMERA connector</text>

  <!-- ===== IMU ===== -->
  <rect class="box sen" x="100" y="580" width="240" height="122" rx="8"/>
  <text x="220" y="606" class="h" text-anchor="middle">LSM9DS1 IMU</text>
  <text x="220" y="628" class="t" text-anchor="middle">3.3 V, 0x6B + 0x1E</text>
  <text x="220" y="648" class="t" text-anchor="middle">on the chassis, away from</text>
  <text x="220" y="667" class="t" text-anchor="middle">motors and power wires</text>
  <text x="220" y="690" class="s" text-anchor="middle">pins and mounting: 06-imu.svg</text>

  <!-- ===== Nucleo and sensors ===== -->
  <rect class="box cpu" x="1080" y="540" width="210" height="160" rx="8"/>
  <text x="1185" y="572" class="h" text-anchor="middle">Nucleo-F401RE</text>
  <text x="1185" y="596" class="t" text-anchor="middle">STM32F401RE</text>
  <text x="1185" y="618" class="t" text-anchor="middle">USB VCP, 115200 8N1</text>
  <text x="1185" y="640" class="t" text-anchor="middle">D1/D2 lines at ~15 Hz</text>
  <text x="1185" y="662" class="t" text-anchor="middle">5 V to sensors</text>
  <text x="1185" y="684" class="s" text-anchor="middle">reads sensors only, no motors</text>

  <rect class="box sen" x="1370" y="550" width="200" height="70" rx="8"/>
  <text x="1470" y="574" class="h" text-anchor="middle">HC-SR04P LEFT</text>
  <text x="1470" y="594" class="t" text-anchor="middle">yaw +45°, TRIG PA0</text>
  <text x="1470" y="612" class="t" text-anchor="middle">ECHO PA1 via divider</text>

  <rect class="box sen" x="1370" y="640" width="200" height="70" rx="8"/>
  <text x="1470" y="664" class="h" text-anchor="middle">HC-SR04P RIGHT</text>
  <text x="1470" y="684" class="t" text-anchor="middle">yaw -45°, TRIG PA8</text>
  <text x="1470" y="702" class="t" text-anchor="middle">ECHO PA9 via divider</text>

  <rect class="flag" x="1150" y="780" width="200" height="42" rx="4"/>
  <text x="1250" y="797" class="s" text-anchor="middle">battery sense PA4 (opt.)</text>
  <text x="1250" y="814" class="s" text-anchor="middle">from J1 via 100k / 10k</text>

  <!-- ===== Camera ===== -->
  <rect class="box sen" x="430" y="805" width="200" height="90" rx="8"/>
  <text x="530" y="835" class="h" text-anchor="middle">Camera v2.1</text>
  <text x="530" y="857" class="t" text-anchor="middle">Sony IMX219</text>
  <text x="530" y="877" class="t" text-anchor="middle">rides on the gizmo</text>
  <text x="650" y="840" class="s">The ribbon crosses the yaw and pitch</text>
  <text x="650" y="858" class="s">joints: leave a loose loop for their travel</text>
  <text x="650" y="876" class="s">(±45° yaw, 0 to -45° pitch).</text>

  <!-- ===== Legend ===== -->
  <rect x="30" y="760" width="350" height="290" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
  <text x="45" y="785" class="h">Legend</text>
  <path class="w24" d="M45 808 H105"/>
  <text x="118" y="813" class="t">24 V battery power</text>
  <path class="w5" d="M45 832 H105"/>
  <text x="118" y="837" class="t">5 V supply</text>
  <path class="usb" d="M45 856 H105"/>
  <text x="118" y="861" class="t">USB</text>
  <path class="can" d="M45 880 H105"/>
  <text x="118" y="885" class="t">CAN (twisted pair, daisy chain)</text>
  <path class="i2c" d="M45 904 H105"/>
  <text x="118" y="909" class="t">I2C (IMU)</text>
  <path class="sig" d="M45 928 H105"/>
  <text x="118" y="933" class="t">sensor signals</text>
  <path class="sense" d="M45 952 H105"/>
  <text x="118" y="957" class="t">battery voltage sense</text>
  <path class="csi" d="M45 976 H105"/>
  <text x="118" y="981" class="t">CSI camera ribbon</text>
  <path class="sig dash" d="M45 1000 H105" style="stroke:#555"/>
  <text x="118" y="1005" class="t">dashed: optional part</text>
  <text x="45" y="1026" class="s">All grounds are common (battery negative). Grounds</text>
  <text x="45" y="1040" class="s">are drawn in the power and Nucleo diagrams.</text>
</svg>
