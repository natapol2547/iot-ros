<?xml version="1.0" encoding="UTF-8"?>
<!-- iot_robot camera ribbon. Hand-written SVG; edit this file directly.
     Facts from the Raspberry Pi documentation "Install a Raspberry Pi camera". -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .title { font-size: 26px; font-weight: bold; }
    .subtitle { font-size: 15px; fill: #444; }
    .h { font-size: 17px; font-weight: bold; }
    .ph { font-size: 17px; font-weight: bold; fill: #0d47a1; }
    .t { font-size: 14px; }
    .s { font-size: 13px; fill: #333; }
    .xs { font-size: 12px; fill: #555; }
    .b { font-weight: bold; }
    .w { fill: #ffffff; }
    .panel { fill: #fafafa; stroke: #999; stroke-width: 1.2; }
    .lead { stroke: #555; stroke-width: 1.4; fill: none; }
    .arrow { stroke: #0d47a1; stroke-width: 2.5; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0d47a1"/>
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="4" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="960" fill="#ffffff"/>

  <text x="30" y="42" class="title">iot_robot: camera ribbon (Camera Module v2.1 to Raspberry Pi 5)</text>
  <text x="30" y="68" class="subtitle">A Pi 5 needs the Standard-Mini cable. The Standard-Standard cable that ships with the camera only fits a Pi 4 or older. Power off before plugging.</text>

  <!-- ================= 1. Raspberry Pi 5, top view ================= -->
  <text x="40" y="110" class="ph">1. Raspberry Pi 5, top view</text>
  <rect x="40" y="130" width="460" height="300" rx="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <!-- GPIO header -->
  <rect x="80" y="142" width="324" height="30" rx="3" fill="#263238"/>
  <g fill="#ffd54f">
    <circle cx="90" cy="151" r="3"/><circle cx="106" cy="151" r="3"/><circle cx="122" cy="151" r="3"/><circle cx="138" cy="151" r="3"/><circle cx="154" cy="151" r="3"/><circle cx="170" cy="151" r="3"/><circle cx="186" cy="151" r="3"/><circle cx="202" cy="151" r="3"/><circle cx="218" cy="151" r="3"/><circle cx="234" cy="151" r="3"/>
    <circle cx="250" cy="151" r="3"/><circle cx="266" cy="151" r="3"/><circle cx="282" cy="151" r="3"/><circle cx="298" cy="151" r="3"/><circle cx="314" cy="151" r="3"/><circle cx="330" cy="151" r="3"/><circle cx="346" cy="151" r="3"/><circle cx="362" cy="151" r="3"/><circle cx="378" cy="151" r="3"/><circle cx="394" cy="151" r="3"/>
    <circle cx="90" cy="163" r="3"/><circle cx="106" cy="163" r="3"/><circle cx="122" cy="163" r="3"/><circle cx="138" cy="163" r="3"/><circle cx="154" cy="163" r="3"/><circle cx="170" cy="163" r="3"/><circle cx="186" cy="163" r="3"/><circle cx="202" cy="163" r="3"/><circle cx="218" cy="163" r="3"/><circle cx="234" cy="163" r="3"/>
    <circle cx="250" cy="163" r="3"/><circle cx="266" cy="163" r="3"/><circle cx="282" cy="163" r="3"/><circle cx="298" cy="163" r="3"/><circle cx="314" cy="163" r="3"/><circle cx="330" cy="163" r="3"/><circle cx="346" cy="163" r="3"/><circle cx="362" cy="163" r="3"/><circle cx="378" cy="163" r="3"/><circle cx="394" cy="163" r="3"/>
  </g>
  <text x="247" y="192" class="s" text-anchor="middle">40-pin GPIO header (edge away from you)</text>
  <!-- right-hand ports -->
  <rect x="430" y="150" width="90" height="70" rx="4" fill="#b0bec5" stroke="#546e7a"/>
  <text x="475" y="190" class="s b" text-anchor="middle">USB 2</text>
  <rect x="430" y="230" width="90" height="70" rx="4" fill="#90caf9" stroke="#546e7a"/>
  <text x="475" y="270" class="s b" text-anchor="middle">USB 3</text>
  <rect x="425" y="315" width="95" height="100" rx="4" fill="#cfd8dc" stroke="#546e7a"/>
  <text x="472" y="370" class="s b" text-anchor="middle">Ethernet</text>
  <!-- SoC -->
  <rect x="200" y="235" width="80" height="80" rx="4" fill="#616161"/>
  <text x="240" y="280" class="xs w b" text-anchor="middle">BCM2712</text>
  <!-- near-edge ports -->
  <rect x="60" y="408" width="40" height="30" rx="4" fill="#9e9e9e" stroke="#424242"/>
  <text x="80" y="400" class="xs" text-anchor="middle">USB-C</text>
  <rect x="130" y="410" width="38" height="26" rx="3" fill="#9e9e9e" stroke="#424242"/>
  <text x="149" y="402" class="xs" text-anchor="middle">HDMI0</text>
  <rect x="185" y="410" width="38" height="26" rx="3" fill="#9e9e9e" stroke="#424242"/>
  <text x="204" y="402" class="xs" text-anchor="middle">HDMI1</text>
  <!-- CAM/DISP connectors -->
  <rect x="270" y="372" width="56" height="16" rx="2" fill="#212121" stroke="#ef6c00" stroke-width="3"/>
  <rect x="340" y="372" width="56" height="16" rx="2" fill="#212121" stroke="#ef6c00" stroke-width="3"/>
  <path class="lead" d="M333 390 V470"/>
  <rect x="40" y="470" width="460" height="54" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="270" y="491" class="s b" text-anchor="middle">CAM/DISP0 and CAM/DISP1: mini 22-pin, 0.5 mm pitch</text>
  <text x="270" y="511" class="s" text-anchor="middle">Either works. Use the one the silkscreen marks; position is approximate.</text>

  <!-- ================= 2. Standard-Mini cable ================= -->
  <text x="580" y="110" class="ph">2. Standard-Mini camera cable</text>
  <text x="850" y="186" class="s" text-anchor="middle">Raspberry Pi part, 200 / 300 / 500 mm (300 or 500 mm for the pan/tilt gizmo)</text>
  <path d="M600 262 H1000 L1040 254 H1100 V310 H1040 L1000 302 H600 Z" fill="#eceff1" stroke="#78909c" stroke-width="1.8"/>
  <rect x="600" y="262" width="34" height="40" fill="#ffca28" stroke="#b28704"/>
  <rect x="1066" y="254" width="34" height="56" fill="#ffca28" stroke="#b28704"/>
  <text x="617" y="286" class="xs b" text-anchor="middle">22</text>
  <text x="1083" y="286" class="xs b" text-anchor="middle">15</text>
  <path class="arrow" d="M596 282 H560" marker-end="url(#ah)"/>
  <path class="arrow" d="M1104 282 H1160" marker-end="url(#ah)"/>
  <text x="600" y="340" class="s b">narrow end: 22-pin, 0.5 mm pitch</text>
  <text x="600" y="358" class="s">goes into the Pi 5 CAM/DISP connector</text>
  <text x="1100" y="340" class="s b" text-anchor="end">wide end: 15-pin, 1.0 mm pitch</text>
  <text x="1100" y="358" class="s" text-anchor="end">goes into the camera</text>
  <text x="850" y="240" class="xs" text-anchor="middle">gold areas = metallic contacts (check which face yours are on)</text>
  <text x="850" y="410" class="s" text-anchor="middle">Pi 4 or older: use the Standard-Standard cable (15-pin both ends)</text>
  <text x="850" y="428" class="s" text-anchor="middle">into the CAMERA connector between the HDMI port and the audio jack.</text>

  <!-- ================= 3. Camera Module v2.1, back view ================= -->
  <text x="1190" y="110" class="ph">3. Camera Module v2.1, back view</text>
  <rect x="1200" y="130" width="240" height="230" rx="8" fill="#c8e6c9" stroke="#1b5e20" stroke-width="2"/>
  <circle cx="1220" cy="150" r="7" fill="#ffffff" stroke="#1b5e20"/>
  <circle cx="1420" cy="150" r="7" fill="#ffffff" stroke="#1b5e20"/>
  <circle cx="1220" cy="270" r="7" fill="#ffffff" stroke="#1b5e20"/>
  <circle cx="1420" cy="270" r="7" fill="#ffffff" stroke="#1b5e20"/>
  <circle cx="1320" cy="215" r="42" fill="none" stroke="#1b5e20" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1320" y="211" class="xs" text-anchor="middle">lens is on</text>
  <text x="1320" y="226" class="xs" text-anchor="middle">the other side</text>
  <rect x="1234" y="312" width="172" height="36" rx="2" fill="#424242"/>
  <rect x="1234" y="312" width="172" height="10" rx="2" fill="#bdbdbd"/>
  <text x="1320" y="342" class="xs w b" text-anchor="middle">15-pin connector</text>
  <path d="M1244 348 V420 H1396 V348" fill="#eceff1" stroke="#78909c" stroke-width="1.8"/>
  <text x="1450" y="321" class="xs">flap</text>
  <path class="lead" d="M1447 317 H1408"/>
  <text x="1320" y="446" class="s" text-anchor="middle">IMX219, 8 MP. About 250 mA from the Pi.</text>

  <!-- ================= 4. Side views ================= -->
  <rect class="panel" x="30" y="560" width="500" height="380" rx="8"/>
  <text x="45" y="588" class="ph">4. Pi end, side view (schematic)</text>
  <rect x="70" y="780" width="420" height="18" fill="#a5d6a7" stroke="#2e7d32"/>
  <text x="80" y="820" class="s">Pi PCB</text>
  <rect x="190" y="738" width="110" height="42" fill="#424242"/>
  <rect x="198" y="770" width="94" height="6" fill="#ffca28"/>
  <polygon points="186,728 304,710 306,720 188,738" fill="#bdbdbd" stroke="#616161"/>
  <rect x="230" y="752" width="250" height="10" fill="#eceff1" stroke="#78909c"/>
  <rect x="230" y="762" width="56" height="5" fill="#ffca28" stroke="#b28704"/>
  <text x="330" y="700" class="s b">flap: pull out, tilt away</text>
  <text x="330" y="716" class="s">from the opening, insert,</text>
  <text x="330" y="732" class="s">then press it closed</text>
  <path class="lead" d="M326 704 L300 714"/>
  <text x="486" y="761" class="xs">cable</text>
  <rect x="60" y="834" width="22" height="10" fill="#ffca28" stroke="#b28704"/>
  <text x="90" y="844" class="xs">gold on the cable = its metallic contacts</text>
  <text x="60" y="866" class="s b">Metallic contacts face AWAY from the flap.</text>
  <text x="60" y="886" class="s">Push the cable in straight and fully, then close</text>
  <text x="60" y="904" class="s">the flap until it clicks. No sharp folds.</text>
  <text x="60" y="922" class="xs">Connector shape differs per board; the rule does not.</text>

  <rect class="panel" x="550" y="560" width="500" height="380" rx="8"/>
  <text x="565" y="588" class="ph">5. Camera end, side view (schematic)</text>
  <rect x="610" y="740" width="300" height="16" fill="#c8e6c9" stroke="#1b5e20"/>
  <text x="620" y="734" class="s">camera PCB (back side up)</text>
  <rect x="700" y="756" width="70" height="44" fill="#616161"/>
  <text x="735" y="820" class="s" text-anchor="middle">lens, facing down / away</text>
  <rect x="800" y="698" width="100" height="42" fill="#424242"/>
  <rect x="808" y="730" width="84" height="6" fill="#ffca28"/>
  <polygon points="796,688 904,670 906,680 798,698" fill="#bdbdbd" stroke="#616161"/>
  <rect x="840" y="712" width="190" height="10" fill="#eceff1" stroke="#78909c"/>
  <rect x="840" y="722" width="52" height="5" fill="#ffca28" stroke="#b28704"/>
  <text x="780" y="652" class="s b" text-anchor="end">flap</text>
  <path class="lead" d="M784 650 L840 682"/>
  <text x="1000" y="706" class="xs" text-anchor="middle">cable</text>
  <rect x="580" y="834" width="22" height="10" fill="#ffca28" stroke="#b28704"/>
  <text x="610" y="844" class="xs">gold on the cable = its metallic contacts</text>
  <text x="580" y="866" class="s b">Contacts face away from the flap, which here</text>
  <text x="580" y="884" class="s b">means towards the camera board.</text>
  <text x="580" y="904" class="s">The connector sits on the side opposite the lens.</text>
  <text x="580" y="922" class="xs">The camera ships with its cable fitted; swap it for the Standard-Mini one.</text>

  <!-- ================= Notes ================= -->
  <rect class="panel" x="1070" y="480" width="500" height="460" rx="8"/>
  <text x="1085" y="508" class="ph">Checklist</text>
  <text x="1085" y="536" class="s">1. Shut the Pi down and unplug it. The camera ports</text>
  <text x="1100" y="554" class="s">are not hot-pluggable.</text>
  <text x="1085" y="576" class="s">2. Touch an earthed object first: the camera is</text>
  <text x="1100" y="594" class="s">static-sensitive.</text>
  <text x="1085" y="616" class="s">3. Swap the camera's cable for the Standard-Mini</text>
  <text x="1100" y="634" class="s">cable: wide end into the camera (section 5).</text>
  <text x="1085" y="656" class="s">4. Narrow end into CAM/DISP0 or CAM/DISP1 on the Pi 5</text>
  <text x="1100" y="674" class="s">(section 4). If you fit the Active Cooler, plug the</text>
  <text x="1100" y="692" class="s">cable in first: the ports are hard to reach after.</text>
  <text x="1085" y="714" class="s">5. Close both flaps and tug lightly: the cable must</text>
  <text x="1100" y="732" class="s">not move.</text>
  <text x="1085" y="754" class="s">6. Boot and list cameras (Raspberry Pi OS:</text>
  <text x="1100" y="772" class="s b">rpicam-hello --list-cameras</text>
  <text x="1100" y="790" class="s">should show imx219).</text>
  <text x="1085" y="822" class="ph">Pan/tilt gizmo</text>
  <text x="1085" y="848" class="s">Leave a loose service loop so the ribbon never pulls</text>
  <text x="1085" y="866" class="s">at full pan and tilt. Let it bend along its length,</text>
  <text x="1085" y="884" class="s">never fold it sharply, and keep it clear of the motor</text>
  <text x="1085" y="902" class="s">and servo wires. Tape or clip it to the gizmo arm so</text>
  <text x="1085" y="920" class="s">the connectors carry no strain.</text>
</svg>
