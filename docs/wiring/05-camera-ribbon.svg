<?xml version="1.0" encoding="UTF-8"?>
<!-- iot_robot camera ribbon. Hand-written SVG; edit this file directly.
     Facts from the Raspberry Pi documentation "Install a Raspberry Pi camera"
     (Raspberry Pi 4: CAMERA connector by the near edge, between the micro HDMI
     connector and the audio jack; Standard-Standard cable; metallic contacts face
     away from the flap). Board layout after the Raspberry Pi 4 mechanical drawing,
     positions approximate. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .title { font-size: 26px; font-weight: bold; }
    .subtitle { font-size: 15px; fill: #444; }
    .h { font-size: 17px; font-weight: bold; }
    .ph { font-size: 17px; font-weight: bold; fill: #0d47a1; }
    .t { font-size: 14px; }
    .s { font-size: 13px; fill: #333; }
    .xs { font-size: 12px; fill: #555; }
    .b { font-weight: bold; }
    .w { fill: #ffffff; }
    .panel { fill: #fafafa; stroke: #999; stroke-width: 1.2; }
    .lead { stroke: #555; stroke-width: 1.4; fill: none; }
    .arrow { stroke: #0d47a1; stroke-width: 2.5; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0d47a1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="960" fill="#ffffff"/>

  <text x="30" y="42" class="title">iot_robot: camera ribbon (Camera Module v2.1 to Raspberry Pi 4)</text>
  <text x="30" y="68" class="subtitle">A Pi 4 takes the Standard-Standard cable (15-pin at both ends) that ships with the camera. Power off before plugging.</text>

  <!-- ================= 1. Raspberry Pi 4, top view ================= -->
  <text x="40" y="110" class="ph">1. Raspberry Pi 4, top view</text>
  <rect x="40" y="130" width="460" height="300" rx="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <!-- GPIO header -->
  <rect x="76" y="142" width="282" height="30" rx="3" fill="#263238"/>
  <g fill="#ffd54f">
    <circle cx="84" cy="151" r="3"/><circle cx="98" cy="151" r="3"/><circle cx="112" cy="151" r="3"/><circle cx="126" cy="151" r="3"/><circle cx="140" cy="151" r="3"/><circle cx="154" cy="151" r="3"/><circle cx="168" cy="151" r="3"/><circle cx="182" cy="151" r="3"/><circle cx="196" cy="151" r="3"/><circle cx="210" cy="151" r="3"/>
    <circle cx="224" cy="151" r="3"/><circle cx="238" cy="151" r="3"/><circle cx="252" cy="151" r="3"/><circle cx="266" cy="151" r="3"/><circle cx="280" cy="151" r="3"/><circle cx="294" cy="151" r="3"/><circle cx="308" cy="151" r="3"/><circle cx="322" cy="151" r="3"/><circle cx="336" cy="151" r="3"/><circle cx="350" cy="151" r="3"/>
    <circle cx="84" cy="163" r="3"/><circle cx="98" cy="163" r="3"/><circle cx="112" cy="163" r="3"/><circle cx="126" cy="163" r="3"/><circle cx="140" cy="163" r="3"/><circle cx="154" cy="163" r="3"/><circle cx="168" cy="163" r="3"/><circle cx="182" cy="163" r="3"/><circle cx="196" cy="163" r="3"/><circle cx="210" cy="163" r="3"/>
    <circle cx="224" cy="163" r="3"/><circle cx="238" cy="163" r="3"/><circle cx="252" cy="163" r="3"/><circle cx="266" cy="163" r="3"/><circle cx="280" cy="163" r="3"/><circle cx="294" cy="163" r="3"/><circle cx="308" cy="163" r="3"/><circle cx="322" cy="163" r="3"/><circle cx="336" cy="163" r="3"/><circle cx="350" cy="163" r="3"/>
  </g>
  <text x="217" y="192" class="s" text-anchor="middle">40-pin GPIO header (edge away from you)</text>
  <!-- right-hand ports -->
  <rect x="410" y="142" width="108" height="86" rx="4" fill="#cfd8dc" stroke="#546e7a"/>
  <text x="464" y="190" class="s b" text-anchor="middle">Ethernet</text>
  <rect x="420" y="248" width="98" height="70" rx="4" fill="#b0bec5" stroke="#546e7a"/>
  <text x="469" y="288" class="s b" text-anchor="middle">USB</text>
  <rect x="420" y="342" width="98" height="70" rx="4" fill="#b0bec5" stroke="#546e7a"/>
  <text x="469" y="382" class="s b" text-anchor="middle">USB</text>
  <!-- SoC -->
  <rect x="157" y="218" width="80" height="80" rx="4" fill="#616161"/>
  <text x="197" y="262" class="xs w b" text-anchor="middle">BCM2711</text>
  <!-- DISPLAY (DSI) connector on the left edge -->
  <rect x="48" y="222" width="16" height="84" rx="2" fill="#212121"/>
  <text x="72" y="260" class="xs b">DISPLAY</text>
  <text x="72" y="275" class="xs">not this one</text>
  <!-- near-edge ports -->
  <rect x="76" y="410" width="48" height="28" rx="4" fill="#9e9e9e" stroke="#424242"/>
  <text x="100" y="456" class="xs" text-anchor="middle">USB-C</text>
  <rect x="164" y="414" width="34" height="22" rx="3" fill="#9e9e9e" stroke="#424242"/>
  <text x="181" y="456" class="xs" text-anchor="middle">HDMI0</text>
  <rect x="237" y="414" width="34" height="22" rx="3" fill="#9e9e9e" stroke="#424242"/>
  <text x="254" y="456" class="xs" text-anchor="middle">HDMI1</text>
  <rect x="312" y="376" width="36" height="56" rx="4" fill="#9e9e9e" stroke="#424242"/>
  <rect x="318" y="430" width="24" height="10" rx="2" fill="#757575" stroke="#424242"/>
  <text x="330" y="456" class="xs" text-anchor="middle">audio</text>
  <!-- CAMERA connector with the ribbon seen edge-on -->
  <rect x="273" y="318" width="22" height="92" rx="2" fill="#212121" stroke="#ef6c00" stroke-width="3"/>
  <rect x="279" y="322" width="4" height="84" fill="#ffca28"/>
  <rect x="284" y="322" width="5" height="84" fill="#1e88e5"/>
  <text x="284" y="309" class="xs b" text-anchor="middle">CAMERA</text>
  <path class="lead" d="M292 412 V472"/>
  <rect x="40" y="472" width="460" height="72" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="270" y="492" class="s b" text-anchor="middle">CAMERA: standard 15-pin, 1.0 mm pitch (not DISPLAY)</text>
  <text x="270" y="510" class="s" text-anchor="middle">Contacts (gold) face the HDMI ports; the blue stiffener</text>
  <text x="270" y="528" class="s" text-anchor="middle">faces the audio jack. Go by the CAMERA silkscreen.</text>

  <!-- ================= 2. Standard-Standard cable ================= -->
  <text x="580" y="110" class="ph">2. Standard-Standard camera cable</text>
  <text x="850" y="160" class="s" text-anchor="middle">Ships fitted to the camera, 150 mm long.</text>
  <text x="850" y="178" class="s" text-anchor="middle">The gizmo will likely need a longer 15-pin, 1.0 mm pitch cable (300 or 500 mm).</text>
  <path d="M600 254 H1100 V310 H600 Z" fill="#eceff1" stroke="#78909c" stroke-width="1.8"/>
  <rect x="600" y="254" width="34" height="56" fill="#ffca28" stroke="#b28704"/>
  <rect x="1066" y="254" width="34" height="56" fill="#ffca28" stroke="#b28704"/>
  <text x="617" y="286" class="xs b" text-anchor="middle">15</text>
  <text x="1083" y="286" class="xs b" text-anchor="middle">15</text>
  <path class="arrow" d="M596 282 H560" marker-end="url(#ah)"/>
  <path class="arrow" d="M1104 282 H1160" marker-end="url(#ah)"/>
  <text x="600" y="340" class="s b">15-pin, 1.0 mm pitch</text>
  <text x="600" y="358" class="s">into the Pi 4 CAMERA connector</text>
  <text x="1100" y="340" class="s b" text-anchor="end">15-pin, 1.0 mm pitch</text>
  <text x="1100" y="358" class="s" text-anchor="end">into the camera</text>
  <text x="850" y="240" class="xs" text-anchor="middle">gold areas = metallic contacts (check which face yours are on)</text>
  <text x="850" y="400" class="s" text-anchor="middle">Both ends are the same size. Insert each end by the one rule:</text>
  <text x="850" y="418" class="s b" text-anchor="middle">metallic contacts face away from the flap (sections 4 and 5).</text>
  <rect x="600" y="434" width="450" height="42" rx="6" fill="#f5f5f5" stroke="#bdbdbd"/>
  <text x="825" y="451" class="xs" text-anchor="middle">Alternative, Raspberry Pi 5: its CAM/DISP connectors are mini 22-pin.</text>
  <text x="825" y="467" class="xs" text-anchor="middle">Use the Standard-Mini cable there, narrow 22-pin end into the Pi.</text>

  <!-- ================= 3. Camera Module v2.1, back view ================= -->
  <text x="1190" y="110" class="ph">3. Camera Module v2.1, back view</text>
  <rect x="1200" y="130" width="240" height="230" rx="8" fill="#c8e6c9" stroke="#1b5e20" stroke-width="2"/>
  <circle cx="1220" cy="150" r="7" fill="#ffffff" stroke="#1b5e20"/>
  <circle cx="1420" cy="150" r="7" fill="#ffffff" stroke="#1b5e20"/>
  <circle cx="1220" cy="270" r="7" fill="#ffffff" stroke="#1b5e20"/>
  <circle cx="1420" cy="270" r="7" fill="#ffffff" stroke="#1b5e20"/>
  <circle cx="1320" cy="215" r="42" fill="none" stroke="#1b5e20" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1320" y="211" class="xs" text-anchor="middle">lens is on</text>
  <text x="1320" y="226" class="xs" text-anchor="middle">the other side</text>
  <rect x="1234" y="312" width="172" height="36" rx="2" fill="#424242"/>
  <rect x="1234" y="312" width="172" height="10" rx="2" fill="#bdbdbd"/>
  <text x="1320" y="342" class="xs w b" text-anchor="middle">15-pin connector</text>
  <path d="M1244 348 V420 H1396 V348" fill="#eceff1" stroke="#78909c" stroke-width="1.8"/>
  <text x="1450" y="321" class="xs">flap</text>
  <path class="lead" d="M1447 317 H1408"/>
  <text x="1320" y="446" class="s" text-anchor="middle">IMX219, 8 MP. About 250 mA from the Pi.</text>

  <!-- ================= 4. Pi end, side view ================= -->
  <rect class="panel" x="30" y="560" width="500" height="380" rx="8"/>
  <text x="45" y="588" class="ph">4. Pi 4 end, side view (schematic)</text>
  <text x="268" y="628" class="xs" text-anchor="middle">to the camera</text>
  <!-- ribbon, vertical -->
  <rect x="264" y="638" width="8" height="122" fill="#eceff1" stroke="#78909c"/>
  <rect x="259" y="720" width="5" height="40" fill="#ffca28" stroke="#b28704"/>
  <rect x="272" y="708" width="5" height="52" fill="#1e88e5"/>
  <!-- connector and lifted flap -->
  <rect x="222" y="730" width="96" height="40" fill="#424242"/>
  <polygon points="282,728 318,708 323,716 287,736" fill="#bdbdbd" stroke="#616161"/>
  <!-- PCB -->
  <rect x="70" y="770" width="420" height="16" fill="#a5d6a7" stroke="#2e7d32"/>
  <text x="480" y="782" class="xs" text-anchor="end">Pi 4 PCB</text>
  <text x="70" y="806" class="xs">HDMI ports this side</text>
  <text x="490" y="806" class="xs" text-anchor="end">audio jack this side</text>
  <!-- labels -->
  <text x="236" y="680" class="s b" text-anchor="end">metallic contacts,</text>
  <text x="236" y="696" class="s" text-anchor="end">towards the HDMI ports</text>
  <path class="lead" d="M238 700 L258 732"/>
  <text x="296" y="652" class="s b">blue stiffener,</text>
  <text x="296" y="668" class="s">towards the audio jack</text>
  <path class="lead" d="M294 672 L277 712"/>
  <text x="340" y="722" class="s b">flap: pull up, tilt away</text>
  <text x="340" y="738" class="s">from the cable, insert,</text>
  <text x="340" y="754" class="s">then press it down</text>
  <path class="lead" d="M336 726 L322 714"/>
  <rect x="60" y="834" width="22" height="10" fill="#ffca28" stroke="#b28704"/>
  <text x="90" y="844" class="xs">metallic contacts</text>
  <rect x="210" y="834" width="22" height="10" fill="#1e88e5"/>
  <text x="240" y="844" class="xs">blue stiffener</text>
  <text x="60" y="866" class="s b">Contacts face AWAY from the flap: towards the HDMI ports.</text>
  <text x="60" y="886" class="s">Push the cable in straight and fully, then press the flap</text>
  <text x="60" y="904" class="s">down until it clicks. No sharp folds.</text>
  <text x="60" y="922" class="xs">Connector shape differs per board; the rule does not.</text>

  <!-- ================= 5. Camera end, side view ================= -->
  <rect class="panel" x="550" y="560" width="500" height="380" rx="8"/>
  <text x="565" y="588" class="ph">5. Camera end, side view (schematic)</text>
  <rect x="610" y="740" width="300" height="16" fill="#c8e6c9" stroke="#1b5e20"/>
  <text x="620" y="734" class="s">camera PCB (back side up)</text>
  <rect x="700" y="756" width="70" height="44" fill="#616161"/>
  <text x="735" y="820" class="s" text-anchor="middle">lens, facing down / away</text>
  <rect x="800" y="698" width="100" height="42" fill="#424242"/>
  <rect x="808" y="730" width="84" height="6" fill="#ffca28"/>
  <polygon points="796,688 904,670 906,680 798,698" fill="#bdbdbd" stroke="#616161"/>
  <rect x="840" y="712" width="190" height="10" fill="#eceff1" stroke="#78909c"/>
  <rect x="840" y="722" width="52" height="5" fill="#ffca28" stroke="#b28704"/>
  <text x="780" y="652" class="s b" text-anchor="end">flap</text>
  <path class="lead" d="M784 650 L840 682"/>
  <text x="1000" y="706" class="xs" text-anchor="middle">cable</text>
  <rect x="580" y="834" width="22" height="10" fill="#ffca28" stroke="#b28704"/>
  <text x="610" y="844" class="xs">gold on the cable = its metallic contacts</text>
  <text x="580" y="866" class="s b">Contacts face away from the flap, which here</text>
  <text x="580" y="884" class="s b">means towards the camera board.</text>
  <text x="580" y="904" class="s">The connector sits on the side opposite the lens.</text>
  <text x="580" y="922" class="xs">The camera ships with this cable fitted; touch it only to fit a longer one.</text>

  <!-- ================= Notes ================= -->
  <rect class="panel" x="1070" y="480" width="500" height="460" rx="8"/>
  <text x="1085" y="508" class="ph">Checklist</text>
  <text x="1085" y="536" class="s">1. Shut the Pi down and unplug it. The camera ports</text>
  <text x="1100" y="554" class="s">are not hot-pluggable.</text>
  <text x="1085" y="576" class="s">2. Touch an earthed object first: the camera is</text>
  <text x="1100" y="594" class="s">static-sensitive.</text>
  <text x="1085" y="616" class="s">3. Camera end: keep the fitted cable, or fit a longer</text>
  <text x="1100" y="634" class="s">15-pin, 1.0 mm cable for the gizmo (section 5).</text>
  <text x="1085" y="656" class="s">4. Pi end into CAMERA, not DISPLAY: contacts towards</text>
  <text x="1100" y="674" class="s">the HDMI ports (sections 1 and 4).</text>
  <text x="1085" y="696" class="s">5. Close both flaps and tug lightly: the cable must</text>
  <text x="1100" y="714" class="s">not move.</text>
  <text x="1085" y="736" class="s">6. Boot and, with the robot software stopped, run</text>
  <text x="1100" y="754" class="s b">rpicam-hello --list-cameras</text>
  <text x="1100" y="772" class="s">It should show imx219.</text>
  <text x="1085" y="804" class="ph">Pan/tilt gizmo</text>
  <text x="1085" y="830" class="s">The ribbon crosses the yaw joint (±45°) and the pitch</text>
  <text x="1085" y="848" class="s">joint. Leave a loose loop at each so it never pulls at</text>
  <text x="1085" y="866" class="s">the limits. Let it bend along its length, never fold it</text>
  <text x="1085" y="884" class="s">sharply, and keep it clear of the motor power and CAN</text>
  <text x="1085" y="902" class="s">wires. Clip it to the gizmo so the connectors carry</text>
  <text x="1085" y="920" class="s">no strain.</text>
</svg>
