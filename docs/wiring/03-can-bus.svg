  <!-- ================= AK45-10 gizmo PITCH (cx 1255) ================= -->
  <rect class="flag" x="1145" y="170" width="220" height="40" rx="4"/>
  <text x="1255" y="186" class="s" text-anchor="middle">XT30 power from J3</text>
  <text x="1255" y="202" class="s" text-anchor="middle">(gizmo branch, fuse F3)</text>
  <rect class="box act" x="1130" y="230" width="250" height="180" rx="8"/>
  <text x="1255" y="256" class="h" text-anchor="middle">AK45-10 gizmo PITCH</text>
  <text x="1255" y="276" class="s" text-anchor="middle">gizmo_pitch_joint</text>
  <text x="1255" y="302" class="id" text-anchor="middle">CAN ID 11</text>
  <text x="1255" y="324" class="s" text-anchor="middle">bus in 1/2, R_T on 3/4</text>
  <text x="1195" y="380" class="s" text-anchor="middle">1</text>
  <text x="1235" y="380" class="s" text-anchor="middle">2</text>
  <text x="1275" y="380" class="s" text-anchor="middle">3</text>
