  </style>
  <rect x="0" y="0" width="1600" height="1080" fill="#ffffff"/>

  <text x="30" y="42" class="title">iot_robot: CAN bus (1 Mbit/s, four AK45-10)</text>
  <text x="30" y="68" class="subtitle">Linear bus, 120 Ω at both ends. White (outlined) = CAN_H, blue = CAN_L, black = GND reference. Stranded twisted pair, 28 AWG (A1257 crimps take AWG 28-32 only).</text>

  <!-- ================= Where the parts sit ================= -->
  <path class="brk" d="M290 148 V140 H820 V148"/>
  <text x="555" y="132" class="s b" text-anchor="middle">on the chassis</text>
  <path class="brk" d="M850 148 V140 H1570 V148"/>
  <text x="1210" y="132" class="s b" text-anchor="middle">on the gizmo (pan/tilt head), R_T included</text>

  <!-- ================= Wires (drawn first, boxes on top) ================= -->
  <!-- W1: adapter -> LEFT pins 1 (CAN_L) and 2 (CAN_H) -->
  <path class="lo" d="M210 410 V460 H355 V410"/>
  <path class="hcase" d="M150 410 V490 H395 V410"/>
  <path class="hcore" d="M150 410 V490 H395 V410"/>
  <!-- W2: LEFT pins 3 (CAN_H) and 4 (CAN_L) -> RIGHT pins 1 (CAN_L) and 2 (CAN_H) -->
  <path class="lo" d="M475 410 V460 H635 V410"/>
  <path class="hcase" d="M435 410 V490 H675 V410"/>
  <path class="hcore" d="M435 410 V490 H675 V410"/>
  <!-- W3: RIGHT pins 3/4 -> YAW pins 1/2 -->
  <path class="lo" d="M755 410 V460 H915 V410"/>
  <path class="hcase" d="M715 410 V490 H955 V410"/>
  <path class="hcore" d="M715 410 V490 H955 V410"/>
  <!-- W4: YAW pins 3/4 -> PITCH pins 1/2 -->
  <path class="lo" d="M1035 410 V460 H1195 V410"/>
  <path class="hcase" d="M995 410 V490 H1235 V410"/>
  <path class="hcore" d="M995 410 V490 H1235 V410"/>
  <!-- W5: PITCH pins 3 (CAN_H) and 4 (CAN_L) -> terminator -->
  <path class="lo" d="M1315 410 V460 H1420 V485"/>
  <path class="hcase" d="M1275 410 V600 H1420 V575"/>
  <path class="hcore" d="M1275 410 V600 H1420 V575"/>
  <!-- adapter GND -> 0 V star point -->
  <path class="gnd" d="M90 410 V600"/>
  <!-- USB -->
  <path class="usb" d="M140 155 V230"/>
  <!-- motor power stubs -->
  <path class="pos" d="M407 210 V230"/>
  <path class="neg" d="M423 210 V230"/>
  <path class="pos" d="M687 210 V230"/>
  <path class="neg" d="M703 210 V230"/>
  <path class="pos" d="M967 210 V230"/>
  <path class="neg" d="M983 210 V230"/>
  <path class="pos" d="M1247 210 V230"/>
  <path class="neg" d="M1263 210 V230"/>

