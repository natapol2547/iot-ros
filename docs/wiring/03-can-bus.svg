  <!-- ================= Harness segment labels (match the WireViz source) ================= -->
  <text x="272" y="520" class="s b" text-anchor="middle">W1</text>
  <text x="555" y="520" class="s b" text-anchor="middle">W2</text>
  <text x="835" y="520" class="s b" text-anchor="middle">W3</text>
  <text x="1115" y="520" class="s b" text-anchor="middle">W4</text>
  <text x="1115" y="538" class="s" text-anchor="middle">service loop across</text>
  <text x="1115" y="554" class="s" text-anchor="middle">the yaw joint</text>
  <text x="1348" y="540" class="s b" text-anchor="middle">W5</text>

  <!-- ================= Terminator ================= -->
  <rect class="res" x="1411" y="485" width="18" height="90"/>
  <text x="1442" y="512" class="t b">R_T 120 Ω</text>
  <text x="1442" y="532" class="s">1/4 W, bus end B,</text>
  <text x="1442" y="550" class="s">soldered to 28 AWG</text>
  <text x="1442" y="568" class="s">leads under 5 cm,</text>
  <text x="1442" y="586" class="s">heat-shrink over it</text>

  <!-- ================= GND flag ================= -->
  <rect class="flag" x="30" y="600" width="300" height="58" rx="4"/>
  <text x="180" y="620" class="s b" text-anchor="middle">0 V terminal block (the star point),</text>
  <text x="180" y="636" class="s b" text-anchor="middle">22 AWG black</text>
  <text x="180" y="652" class="s" text-anchor="middle">common reference for the CAN transceivers</text>

  <!-- ================= Common port note ================= -->
  <rect class="flag" x="360" y="600" width="890" height="58" rx="4"/>
  <text x="375" y="620" class="s"><tspan class="b">Every AK45-10 (original, V2.0):</tspan> CAN port A1257WR-S-4P, plug A1257H-4P. Pins 1+4 and 2+3 are bridged inside,</text>
  <text x="375" y="638" class="s">so the bus enters on 1/2 and leaves on 3/4. CAN_H leaving on pin 3 and entering the next motor on pin 2 is intended.</text>

  <!-- ================= Panels ================= -->
  <rect class="panel" x="30" y="690" width="500" height="375" rx="8"/>
  <text x="45" y="718" class="ph">A. Termination check (multimeter, Ω)</text>
  <text x="45" y="744" class="s">Everything powered OFF and plugged together. Measure</text>
  <text x="45" y="762" class="s">CAN_H to CAN_L at any connector on the bus:</text>
  <text x="60" y="784" class="s"><tspan class="b">about 60 Ω</tspan>: correct, two terminators in parallel</text>
  <text x="60" y="802" class="s"><tspan class="b">about 120 Ω</tspan>: one terminator missing</text>
  <text x="60" y="820" class="s"><tspan class="b">about 40 Ω</tspan>: three terminators</text>
  <text x="60" y="838" class="s"><tspan class="b">about 30 Ω / 24 Ω</tspan>: four / five terminators</text>
  <text x="60" y="856" class="s"><tspan class="b">open</tspan>: no terminators, or a broken wire</text>
  <text x="60" y="874" class="s"><tspan class="b">near 0 Ω</tspan>: CAN_H shorted to CAN_L</text>
  <text x="45" y="902" class="s">Before building the harness, measure each part alone:</text>
  <text x="45" y="920" class="s">- Bare motor, pin 2 to pin 1: about 120 Ω means it has a</text>
  <text x="56" y="938" class="s">built-in terminator; kΩ or more means none. CubeMars</text>
  <text x="56" y="956" class="s">documents none, so expect kΩ.</text>
  <text x="45" y="976" class="s">- Bare adapter, CAN_H to CAN_L: about 120 Ω means its</text>
  <text x="56" y="994" class="s">terminator is on.</text>
  <text x="45" y="1022" class="s">If the motors do have built-in terminators, four of them</text>
  <text x="45" y="1040" class="s">load the bus to about 30 Ω. Ask CubeMars before driving.</text>

  <rect class="panel" x="550" y="690" width="500" height="375" rx="8"/>
  <text x="565" y="718" class="ph">B. CAN IDs and the joint mapping</text>
  <text x="565" y="744" class="s">The four motors are set to CAN IDs 10, 11, 12 and 13.</text>
  <text x="565" y="762" class="s">Which ID drives which joint was <tspan class="b">confirmed</tspan> against the</text>
  <text x="565" y="780" class="s">hardware on 2026-09-24 (as drawn). Each joint's ID lives</text>
  <text x="565" y="798" class="s">in src/iot_robot_bringup/config/motors.yaml, not the wiring.</text>
  <text x="565" y="824" class="s">A replaced motor changes it. Re-check with the robot</text>
  <text x="565" y="842" class="s">software stopped and the wheels off the ground:</text>
  <text x="565" y="864" class="s b">pixi run -e robot can-identify</text>
  <text x="565" y="886" class="s">Each motor moves about 5° out and back; answer which</text>
  <text x="565" y="904" class="s">joint moved. With --write the tool updates motors.yaml.</text>
  <text x="565" y="930" class="s">New or replaced motor: set its ID with the CubeMars R-Link</text>
  <text x="565" y="948" class="s">and Upper Computer, one motor at a time. The tool's</text>
  <text x="565" y="966" class="s"><tspan class="b">921600</tspan> is the R-Link serial (COM port) baud, not the CAN</text>
  <text x="565" y="984" class="s">bitrate. The CAN rate stays at <tspan class="b">1 Mbit/s</tspan>, and "Send status</text>
  <text x="565" y="1002" class="s">over CAN" must be on (cubemars_hardware needs it).</text>
  <text x="565" y="1028" class="s">Check every motor reports:</text>
  <text x="565" y="1046" class="s b">pixi run -e robot can-check</text>

  <rect class="panel" x="1070" y="690" width="500" height="375" rx="8"/>
  <text x="1085" y="718" class="ph">C. Rules for this bus</text>
  <text x="1085" y="744" class="s">- One chain, no star: adapter, LEFT, RIGHT, YAW, PITCH, R_T.</text>
  <text x="1085" y="764" class="s">- Exactly two 120 Ω terminators, one at each end.</text>
  <text x="1085" y="784" class="s">- Twist the CAN_H/CAN_L pair along its whole length and</text>
  <text x="1096" y="802" class="s">route it away from the XT30 power leads.</text>
  <text x="1085" y="822" class="s">- Any branch (stub) off the chain: under 30 cm.</text>
  <text x="1085" y="842" class="s">- W4 and the PITCH power pair cross the yaw joint: leave</text>
  <text x="1096" y="860" class="s">a service loop for ±45° and tie it down on both sides.</text>
  <text x="1085" y="880" class="s">- The motor CAN port has no GND pin. Run the adapter's</text>
  <text x="1096" y="898" class="s">GND wire to the 0 V star point anyway: it references an</text>
  <text x="1096" y="916" class="s">isolated adapter and does no harm otherwise.</text>
  <text x="1085" y="936" class="s">- Plug or unplug CAN only with the motor supply off.</text>
  <text x="1085" y="956" class="s">- Moving a motor to another place in the chain needs no</text>
  <text x="1096" y="974" class="s">software change; changing its joint needs motors.yaml.</text>
  <text x="1085" y="1010" class="s">AK45-10 V3.0 (one XT30(2+2) plug per motor):</text>
  <text x="1085" y="1028" class="s">pin 3 = CAN_H, pin 4 = CAN_L. See wiring.md.</text>
</svg>
