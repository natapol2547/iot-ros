controller_manager:
  ros__parameters:
    update_rate: 100
    enforce_command_limits: true

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

diff_drive_controller:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController
    left_wheel_names: ["wheel_joint_left"]
    right_wheel_names: ["wheel_joint_right"]
    wheel_separation: 0.349
    wheel_radius: 0.0754
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    # Room for the web page's turbo mode: 3 x 0.4 m/s and 3 x 1.5 rad/s
    linear.x.max_velocity: 1.2
    linear.x.min_velocity: -1.2
    angular.z.max_velocity: 4.5
    angular.z.min_velocity: -4.5

gizmo_controller:
  ros__parameters:
    type: position_controllers/JointGroupPositionController
    joints:
      - gizmo_yaw_joint
      - gizmo_pitch_joint
